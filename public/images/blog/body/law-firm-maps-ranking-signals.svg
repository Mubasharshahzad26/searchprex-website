<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" fill="none">
  <rect width="1200" height="590" rx="28" fill="#F5F7FA"/>
  <text x="72" y="83" fill="#13263B" font-family="Arial,sans-serif" font-size="30" font-weight="700">The three signals behind local results</text>
  <text x="72" y="122" fill="#65758A" font-family="Arial,sans-serif" font-size="18">Google describes relevance, distance, and prominence as the main factors.</text>
  <path d="M289 316h246M665 316h246" stroke="#C9D4DF" stroke-width="4" stroke-dasharray="9 10"/>
  <g><rect x="72" y="177" width="318" height="271" rx="20" fill="#FFFFFF" stroke="#DDE5EC" stroke-width="2"/><circle cx="231" cy="257" r="43" fill="#E3F0E7"/><path d="M209 255h44M231 233v44M216 240l30 30M246 240l-30 30" stroke="#427E5B" stroke-width="5" stroke-linecap="round"/><text x="231" y="339" text-anchor="middle" fill="#142A40" font-family="Arial,sans-serif" font-size="25" font-weight="700">Relevance</text><text x="231" y="378" text-anchor="middle" fill="#627286" font-family="Arial,sans-serif" font-size="17">Does this profile fit the</text><text x="231" y="404" text-anchor="middle" fill="#627286" font-family="Arial,sans-serif" font-size="17">search and the service?</text></g>
  <g><rect x="441" y="177" width="318" height="271" rx="20" fill="#FFFFFF" stroke="#DDE5EC" stroke-width="2"/><circle cx="600" cy="257" r="43" fill="#FFF0D1"/><path d="M600 226c-17 0-30 13-30 30 0 22 30 48 30 48s30-26 30-48c0-17-13-30-30-30Z" stroke="#D99D2C" stroke-width="5"/><circle cx="600" cy="256" r="9" fill="#D99D2C"/><text x="600" y="339" text-anchor="middle" fill="#142A40" font-family="Arial,sans-serif" font-size="25" font-weight="700">Distance</text><text x="600" y="378" text-anchor="middle" fill="#627286" font-family="Arial,sans-serif" font-size="17">How near is the eligible</text><text x="600" y="404" text-anchor="middle" fill="#627286" font-family="Arial,sans-serif" font-size="17">business to the searcher?</text></g>
  <g><rect x="810" y="177" width="318" height="271" rx="20" fill="#FFFFFF" stroke="#DDE5EC" stroke-width="2"/><circle cx="969" cy="257" r="43" fill="#E7ECF7"/><path d="M949 269v-15l20-17 20 17v15M956 267v-9h10v9M945 275h48" stroke="#576F9A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="969" y="339" text-anchor="middle" fill="#142A40" font-family="Arial,sans-serif" font-size="25" font-weight="700">Prominence</text><text x="969" y="378" text-anchor="middle" fill="#627286" font-family="Arial,sans-serif" font-size="17">How well known and trusted</text><text x="969" y="404" text-anchor="middle" fill="#627286" font-family="Arial,sans-serif" font-size="17">is the firm across the web?</text></g>
  <text x="600" y="518" text-anchor="middle" fill="#65758A" font-family="Arial,sans-serif" font-size="16">You can strengthen relevance and prominence; you cannot move your office closer to each searcher.</text>
</svg>
