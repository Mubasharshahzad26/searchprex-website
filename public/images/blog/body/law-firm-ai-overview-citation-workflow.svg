<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" fill="none">
  <rect width="1200" height="560" rx="26" fill="#F5F7FA"/>
  <text x="68" y="76" fill="#14283F" font-family="Arial,sans-serif" font-size="29" font-weight="700">Build the page first. Measure visibility second.</text>
  <text x="68" y="112" fill="#68788C" font-family="Arial,sans-serif" font-size="17">Google confirms eligibility requirements; editorial quality supports the reader.</text>
  <path d="M286 296h24M576 296h24M866 296h24" stroke="#C8D3DE" stroke-width="4" stroke-linecap="round"/>
  <g><rect x="58" y="160" width="252" height="264" rx="18" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="2"/><circle cx="184" cy="227" r="31" fill="#E5EDF5"/><path d="M170 222h28M170 232h28M176 242h16" stroke="#527190" stroke-width="4" stroke-linecap="round"/><text x="184" y="294" text-anchor="middle" fill="#1A3048" font-family="Arial,sans-serif" font-size="21" font-weight="700">1. Check eligibility</text><text x="184" y="332" text-anchor="middle" fill="#68788C" font-family="Arial,sans-serif" font-size="15">Crawl, index, canonical,</text><text x="184" y="355" text-anchor="middle" fill="#68788C" font-family="Arial,sans-serif" font-size="15">and snippet settings</text><rect x="113" y="382" width="142" height="25" rx="12.5" fill="#EAF0F6"/><text x="184" y="399" text-anchor="middle" fill="#496987" font-family="Arial,sans-serif" font-size="12" font-weight="700">GOOGLE CONFIRMS</text></g>
  <g><rect x="348" y="160" width="252" height="264" rx="18" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="2"/><circle cx="474" cy="227" r="31" fill="#FFF1D6"/><path d="M458 218h32M458 228h25M458 238h18" stroke="#B77B1C" stroke-width="4" stroke-linecap="round"/><text x="474" y="294" text-anchor="middle" fill="#1A3048" font-family="Arial,sans-serif" font-size="21" font-weight="700">2. Answer the issue</text><text x="474" y="332" text-anchor="middle" fill="#68788C" font-family="Arial,sans-serif" font-size="15">Clear, accurate, useful</text><text x="474" y="355" text-anchor="middle" fill="#68788C" font-family="Arial,sans-serif" font-size="15">for a real client question</text><rect x="404" y="382" width="140" height="25" rx="12.5" fill="#FFF2D8"/><text x="474" y="399" text-anchor="middle" fill="#9B6C1D" font-family="Arial,sans-serif" font-size="12" font-weight="700">EDITORIAL PRACTICE</text></g>
  <g><rect x="638" y="160" width="252" height="264" rx="18" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="2"/><circle cx="764" cy="227" r="31" fill="#E8F0E9"/><path d="M750 224h28M752 233h24M758 242h12M752 214h24" stroke="#4C8060" stroke-width="3.5" stroke-linecap="round"/><text x="764" y="294" text-anchor="middle" fill="#1A3048" font-family="Arial,sans-serif" font-size="21" font-weight="700">3. Show evidence</text><text x="764" y="332" text-anchor="middle" fill="#68788C" font-family="Arial,sans-serif" font-size="15">Attorney review, state scope,</text><text x="764" y="355" text-anchor="middle" fill="#68788C" font-family="Arial,sans-serif" font-size="15">and current primary sources</text><rect x="694" y="382" width="140" height="25" rx="12.5" fill="#EAF2EB"/><text x="764" y="399" text-anchor="middle" fill="#477555" font-family="Arial,sans-serif" font-size="12" font-weight="700">EDITORIAL PRACTICE</text></g>
  <g><rect x="928" y="160" width="252" height="264" rx="18" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="2"/><circle cx="1054" cy="227" r="31" fill="#EEEAF6"/><path d="M1038 240v-18l16-13 16 13v18M1045 239v-10h18v10" stroke="#6A6090" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="1054" y="294" text-anchor="middle" fill="#1A3048" font-family="Arial,sans-serif" font-size="21" font-weight="700">4. Measure it</text><text x="1054" y="332" text-anchor="middle" fill="#68788C" font-family="Arial,sans-serif" font-size="15">Search Console impressions,</text><text x="1054" y="355" text-anchor="middle" fill="#68788C" font-family="Arial,sans-serif" font-size="15">qualified leads, signed matters</text><rect x="984" y="382" width="140" height="25" rx="12.5" fill="#EEEAF6"/><text x="1054" y="399" text-anchor="middle" fill="#665A8E" font-family="Arial,sans-serif" font-size="12" font-weight="700">MEASUREMENT</text></g>
  <text x="600" y="488" text-anchor="middle" fill="#68788C" font-family="Arial,sans-serif" font-size="16">Clear writing and good legal review help readers. Neither guarantees an AI Overview citation.</text>
</svg>
